<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PeerZap</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="panel-body">
<div id="toasts"></div>
<div id="pscrim"></div>
<div id="panel">
  <div class="pwrap">
    <div class="pgrab"></div>
    <div class="phead">
      <div>
        <div class="ptitle">PeerZap</div>
        <div class="psub" id="psub">Direct. Fast. Effortless.</div>
      </div>
      <button class="iconbtn" id="pclose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <!-- kept static so switching Send / Receive never rebuilds them (no jump) -->
    <div class="seg pseg" id="pseg">
      <span id="psegind" aria-hidden="true"></span>
      <button class="segb on" data-act="mode" data-v="send">Send</button>
      <button class="segb" data-act="mode" data-v="receive">Receive</button>
    </div>
    <div class="chiprow" id="pchips" hidden></div>
    <div id="pbody"></div>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
